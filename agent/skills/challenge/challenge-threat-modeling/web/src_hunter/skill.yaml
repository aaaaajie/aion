id: web.src_hunter
name: Src Hunter
version: 1.0.0
category:
- web
- vulnerability
stage:
- reconnaissance
- initial_access
description: 实战 SRC / 众测 / Bug bounty 漏洞挖掘工作流 skill。包含：5 阶段方法论（intake → recon → enum → hunt → report）、19 个攻击类 playbook（SQLi/XSS/RCE/SSRF/IDOR/CSRF/Path Traversal/File Upload/SSTI/XXE/Race/HTTP Smuggling/OAuth/JWT/SAML/GraphQL/Mobile/LLM/DoS）、305 个结构化 payload、263 个 WAF/EDR 绕过变体、2887 份 HackerOne 真实 High/Critical 已披露案例、77,000+ WooYun 案例统计、国产 OA / 中间件指纹库、银行 / 电信行业垂直 playbook。当用户提到 "src 挖洞 / src 漏洞挖掘 / bug bounty / 众测 / hackerone / 漏洞赏金 / SRC / 任意 X 漏洞 / 渗透测试" 或问"如何挖某个目标 / 怎么测某个 API / 如何绕过 WAF" 时触发。
risk_level: medium
trigger:
  keywords:
  - web
  - src
  - hunter
  - bug
  - bounty
  - skill
  - intake
  - recon
  - enum
  - hunt
  evidence:
  - request_response
  - reproduction_steps
requires:
  tools:
  - burpsuite
  - sqlmap
  - ida
  - nmap
  - frida
  - http_request
  - response_compare
  permissions:
  - execution
workflow:
- detect
- confirm
- exploit
- validate
outputs:
  findings:
  - SRC_HUNTER
  evidence:
  - request_response
  - reproduction_steps
  - verified_impact
  credentials:
    optional: false
tags:
- web
- src
- hunter
- bug
- bounty
- skill
- intake
- recon
