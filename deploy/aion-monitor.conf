server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /etc/aion/tls/monitor.crt;
    ssl_certificate_key /etc/aion/tls/monitor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIONMonitorTLS:1m;
    ssl_session_timeout 10m;

    auth_basic "AION Runtime Monitor";
    auth_basic_user_file /etc/nginx/aion-monitor.htpasswd;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
