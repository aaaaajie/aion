server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /etc/aion/tls/monitor.crt;
    ssl_certificate_key /etc/aion/tls/monitor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIONMonitorTLS:1m;
    ssl_session_timeout 10m;

    auth_basic "AION Runtime Monitor";
    auth_basic_user_file /etc/nginx/aion-monitor.htpasswd;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location = /runs {
        return 301 /runs/;
    }

    location /runs/ {
        auth_basic "AION Run Data";
        auth_basic_user_file /etc/nginx/aion-runs.htpasswd;

        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log /var/log/nginx/aion-runs-access.log combined;
    }
}
